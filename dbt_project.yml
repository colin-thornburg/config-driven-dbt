name: my_new_project
version: 1.0.0
dbt-cloud:
  project-id: 70403103995699
config-version: 2
profile: default
model-paths:
  - models
analysis-paths:
  - analyses
test-paths:
  - tests
seed-paths:
  - seeds
macro-paths:
  - macros
snapshot-paths:
  - snapshots
target-path: target
clean-targets:
  - target
  - dbt_packages
vars:
  client_mappings:
    - client_code: GLOBEX
      client_name: Globex Corporation
      source_table: globex_staff_records
      target_model: dim_candidate
      field_mappings:
        candidate_id: staff_id
        full_name: full_name
        email: work_email
        phone_number: phone
        hire_date: onboard_date
        hourly_rate: pay_rate
        client_code: "'GLOBEX'"
    - client_code: WAYNE
      client_name: Wayne Enterprises
      source_table: wayne_enterprises_workers
      target_model: dim_candidate
      field_mappings:
        candidate_id: worker_id
        full_name: first_name || ' ' || last_name
        email: email
        phone_number: contact_phone
        hire_date: hire_date
        hourly_rate: hourly_wage
        client_code: "'WAYNE'"
models:
  my_new_project:
    staging:
      +materialized: view
      +tags:
        - staging
    dimensions:
      +materialized: table
      +tags:
        - dimension
